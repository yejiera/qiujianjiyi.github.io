<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>信笺慢展 · 折信如晤 </title>
  <!-- React & ReactDOM & Babel -->
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #f9f1e0;
      font-family: 'Segoe UI', 'Noto Sans SC', 'Georgia', '华文楷书', serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .app {
      width: 100%;
      min-height: 100vh;
      background: #fdf8ed;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      box-shadow: inset 0 0 50px rgba(160, 110, 50, 0.05);
    }
    .app::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" opacity="0.06"><path fill="none" d="M0 0 L400 0 L400 300 L0 300 Z" stroke="%238b5a2b" stroke-width="0.5" stroke-dasharray="2 6"/><circle cx="30" cy="40" r="2" fill="%238b5a2b"/><circle cx="150" cy="120" r="1.5" fill="%238b5a2b"/><circle cx="280" cy="210" r="2.2" fill="%238b5a2b"/></svg>');
      background-repeat: repeat;
      pointer-events: none;
      z-index: 0;
    }
    .app > * {
      position: relative;
      z-index: 2;
    }
    .header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .title {
      font-size: 2rem;
      font-weight: 500;
      color: #b46f3a;
      font-family: 'Georgia', '华文楷书', cursive;
      letter-spacing: 4px;
    }
    .sub {
      color: #c69c6d;
      font-size: 0.85rem;
      border-top: 1px dashed #e4cfa2;
      display: inline-block;
      padding-top: 6px;
      margin-top: 8px;
    }
    .search-section {
      width: 100%;
      max-width: 520px;
      margin: 0 auto 2rem;
    }
    .search-bar {
      display: flex;
      background: #fffbf0;
      border: 1px solid #dbbc8c;
      border-radius: 60px;
      overflow: hidden;
      box-shadow: 0 6px 14px rgba(80, 45, 20, 0.08);
    }
    .search-bar:focus-within {
      border-color: #c9995c;
      box-shadow: 0 0 0 3px rgba(201, 128, 62, 0.2);
    }
    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 14px 22px;
      font-size: 0.95rem;
      color: #4c2f17;
      outline: none;
      font-family: inherit;
    }
    .search-input::placeholder {
      color: #c8ad82;
      font-style: italic;
    }
    .search-btn {
      background: #e7cfaa;
      border: none;
      padding: 0 28px;
      font-weight: bold;
      color: #5e3d1e;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.2s;
    }
    .search-btn:hover {
      background: #debe87;
    }
    /* 信封舞台 + 3D透视 */
    .stage {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 540px;
      position: relative;
    }
    .envelope-container {
      position: relative;
      width: 100%;
      max-width: 520px;
      min-height: 380px;
      perspective: 1300px;
      perspective-origin: 50% 20%;
    }
    /* 信封本体 (永不消失) */
    .envelope-body {
      position: relative;
      width: 100%;
      background: #b98c5c;
      border-radius: 12px;
      box-shadow: 0 20px 30px -12px rgba(60, 35, 10, 0.45);
      border: 1px solid #92693e;
      z-index: 10;
      transform-style: preserve-3d;
      cursor: pointer;
      transition: box-shadow 0.2s;
    }
    .envelope-body:hover {
      box-shadow: 0 24px 34px -12px rgba(60, 35, 10, 0.55);
    }
    /* 信封翻盖 (三角舌) */
    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 65%;
      background: #c99c6c;
      border-bottom: 2px solid #9c7246;
      border-radius: 12px 12px 0 0;
      transform-origin: top center;
      z-index: 12;
      transform: rotateX(0deg);
      transition: transform 0.65s cubic-bezier(0.23, 1, 0.32, 1);
      clip-path: polygon(0% 0%, 0% 40%,50% 100% , 100% 40%, 100% 0%);
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      backface-visibility: hidden;
    }
    /* 翻盖打开 */
    .envelope-body.open-flap .envelope-flap {
      transform: rotateX(-90deg);
    }
    /* 信纸容器：绝对定位在信封内部底部 */
    .letter-sheet {
      position: absolute;
      left: 20px;
      right: 20px;
      bottom: 16px;
      background: #fffef5;
      border-radius: 10px;
      box-shadow: 0 10px 22px rgba(30,20,5,0.2);
      padding: 20px 18px;
      overflow-y: auto;
      z-index: 25;
      transform-origin: bottom center;
      opacity: 0;
      transform: translateY(0px) rotateX(0deg) translateZ(0px);
      transition: none;
      border: 1px solid #eadbba;
      pointer-events: auto;
      max-height: 340px;
    }
    /* 抽信阶段：从信封开口向上抽出，伴随3D纵深和轻微前倾 */
    .letter-sheet.extracting {
      transition: transform 0.7s cubic-bezier(0.2, 0.9, 0.35, 1.2), opacity 0.4s ease-out;
      transform: translateY(-210px) rotateX(-10deg) translateZ(42px);
      opacity: 1;
      box-shadow: 0 20px 30px rgba(0,0,0,0.25);
    }
    /* 最终下落并浮于信封表面：抽信结束后优雅落位 */
    .letter-sheet.settled {
      transition: transform 0.55s cubic-bezier(0.2, 0.85, 0.4, 1);
      transform: translateY(-74px) rotateX(2deg) translateZ(10px);
      opacity: 1;
      box-shadow: 0 12px 24px rgba(0,0,0,0.15);
    }
    /* 信纸内部样式 */
    .letter-content {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .letter-title {
      font-size: 1.5rem;
      font-weight: 600;
      color: #7c5d3c;
      border-left: 5px solid #e2bc82;
      padding-left: 14px;
      font-family: 'Georgia', serif;
    }
    .letter-desc {
      font-size: 0.8rem;
      color: #b38b5c;
      font-style: italic;
      margin-top: -6px;
    }
    .letter-image {
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      background: #efe2cf;
      margin: 8px 0;
    }
    .letter-image img {
      width: 100%;
      display: block;
      object-fit: cover;
      max-height: 260px;
    }
    .letter-text {
      background: #fffaf0;
      padding: 18px;
      border-radius: 12px;
      font-family: 'Courier New', '华文楷书', monospace;
      font-size: 0.85rem;
      line-height: 1.7;
      color: #4a341e;
      white-space: pre-wrap;
      border: 1px solid #f1e2ca;
    }
    /* 落款区域 */
    .letter-signature {
      margin-top: 18px;
      border-top: 1px dashed #eddbbc;
      padding-top: 14px;
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: #9c7a58;
      font-family: 'Georgia', '楷体', serif;
    }
    .author {
      font-style: italic;
    }
    .date {
      letter-spacing: 0.5px;
    }
    /* 导航 */
    .result-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      margin-top: 32px;
      background: #f3ebd9b3;
      backdrop-filter: blur(8px);
      padding: 10px 22px;
      border-radius: 60px;
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
    }
    .nav-btn {
      background: #ecd9b4;
      border: none;
      padding: 6px 24px;
      border-radius: 40px;
      font-size: 0.8rem;
      font-weight: 500;
      color: #6c4a28;
      cursor: pointer;
      transition: 0.2s;
    }
    .nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .nav-btn:hover:not(:disabled) {
      background: #debe87;
    }
    .result-counter {
      font-size: 0.8rem;
      color: #b88654;
      font-family: monospace;
    }
    .empty-state {
      text-align: center;
      background: #fffcf0;
      border-radius: 48px;
      padding: 40px 20px;
      color: #caa87b;
      max-width: 420px;
      margin: 20px auto;
      border: 1px dashed #e7cfaa;
    }
    .envelope-click-hint {
      position: absolute;
      bottom: 16px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.7rem;
      color: #fef0cf;
      background: #8b5a2baa;
      width: fit-content;
      margin: 0 auto;
      padding: 4px 14px;
      border-radius: 40px;
      backdrop-filter: blur(3px);
      z-index: 15;
      pointer-events: none;
      font-style: italic;
    }
    footer {
      margin-top: 30px;
      font-size: 0.7rem;
      color: #c6a77c;
      text-align: center;
    }
    @media (max-width: 560px) {
      .envelope-container {
        max-width: 94%;
      }
      .letter-sheet {
        padding: 16px;
        left: 12px;
        right: 12px;
      }
      .letter-sheet.settled {
        transform: translateY(-58px) rotateX(1deg) translateZ(6px);
      }
      .letter-sheet.extracting {
        transform: translateY(-175px) rotateX(-8deg) translateZ(30px);
      }
      .letter-title {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
  const { useState, useCallback, useEffect, useRef } = React;

  // 内置书信数据 (增加落款人和日期)
  const EMBEDDED_DB = [
    {
      id: "1",
      type: "image",
      title: "深秋的信笺",
      desc: "一片银杏叶，寄往旧年",
      keywords: ["秋天", "银杏", "怀旧", "落叶"],
      content: "https://picsum.photos/id/104/500/350",
      author: "旧友 敬上",
      date: "丙申年霜降"
    },
    {
      id: "2",
      type: "text",
      title: "夜航船",
      desc: "孤灯下的一纸墨痕",
      keywords: ["船", "夜", "孤独", "理想"],
      content: "我在深夜的甲板上，听水声如同旧事。星子坠入江心，溅不起一丝涟漪。远方有隐约的钟，敲打着未眠人的梦境。",
      author: "旅人 于江畔",
      date: "癸卯年六月廿一"
    },
    {
      id: "3",
      type: "image",
      title: "书房旧影",
      desc: "一缕阳光，几卷残书",
      keywords: ["书房", "旧物", "安静", "书香"],
      content: "https://picsum.photos/id/20/500/350",
      author: "静轩主人",
      date: "戊戌年腊月"
    },
    {
      id: "4",
      type: "text",
      title: "春天的契约",
      desc: "花开时，你会归来",
      keywords: ["春天", "约定", "花", "重逢"],
      content: "三月的风已经暖了，杏花落满石阶。你说你会来，于是我把门前的灯擦得很亮。若你失约，就让燕子衔走这封信。",
      author: "故人 寄",
      date: "甲辰年仲春"
    },
     {
      id: "6",
      type: "text",
      title: "To x",
      desc: "疯狂星期四",
      keywords: ["X", "x"],
      content: "v我50！",
      author: "一位神秘人",
      date: "2026.6.4"
    },
    {
      id: "5",
      type: "image",
      title: "旧皮箱",
      desc: "装满时光的痕迹",
      keywords: ["旅行", "旧物", "回忆", "皮箱"],
      content: "https://picsum.photos/id/96/500/350",
      author: "行者 留",
      date: "辛丑年秋分"
    }
  ];

  function searchByKeywords(db, query) {
    if (!query.trim()) return [];
    const q = query.toLowerCase().trim();
    return db.filter(item =>
      item.keywords.some(kw => kw.toLowerCase().includes(q) || q.includes(kw.toLowerCase()))
    );
  }

  // 核心组件：信封 + 真实3D抽信动画 (点击信封触发)
  function LetterDisplay({ item }) {
    // 动画状态机: 'closed' -> 'flapOpening' -> 'extracting' -> 'settled'
    const [animState, setAnimState] = useState('closed');
    const flapTimerRef = useRef(null);
    const extractTimerRef = useRef(null);
    const settleTimerRef = useRef(null);
    const letterRef = useRef(null);
    const isMounted = useRef(true);
    
    // 组件卸载时清理所有定时器
    useEffect(() => {
      isMounted.current = true;
      return () => {
        isMounted.current = false;
        if (flapTimerRef.current) clearTimeout(flapTimerRef.current);
        if (extractTimerRef.current) clearTimeout(extractTimerRef.current);
        if (settleTimerRef.current) clearTimeout(settleTimerRef.current);
      };
    }, []);
    
    // 监听信纸抽取动画结束 -> 切换到下落阶段
    const onExtractTransitionEnd = useCallback((e) => {
      if (animState !== 'extracting') return;
      if (e.target !== letterRef.current) return;
      if (e.propertyName !== 'transform' && e.propertyName !== 'all') return;
      
      if (extractTimerRef.current) clearTimeout(extractTimerRef.current);
      if (isMounted.current) {
        setAnimState('settled');
      }
    }, [animState]);
    
    // 监听信纸下落过渡结束，可选
    const onSettleTransitionEnd = useCallback((e) => {
      if (animState !== 'settled') return;
      if (e.target !== letterRef.current) return;
    }, [animState]);
    
    useEffect(() => {
      const letterEl = letterRef.current;
      if (!letterEl) return;
      
      if (animState === 'extracting') {
        letterEl.addEventListener('transitionend', onExtractTransitionEnd);
      } else if (animState === 'settled') {
        letterEl.addEventListener('transitionend', onSettleTransitionEnd);
      }
      return () => {
        if (letterEl) {
          letterEl.removeEventListener('transitionend', onExtractTransitionEnd);
          letterEl.removeEventListener('transitionend', onSettleTransitionEnd);
        }
      };
    }, [animState, onExtractTransitionEnd, onSettleTransitionEnd]);
    
    // 处理信封点击：开始拆信序列
    const handleEnvelopeClick = () => {
      if (animState !== 'closed') return;
      setAnimState('flapOpening');
      
      flapTimerRef.current = setTimeout(() => {
        if (!isMounted.current) return;
        setAnimState('extracting');
        
        extractTimerRef.current = setTimeout(() => {
          if (isMounted.current && animState === 'extracting') {
            setAnimState('settled');
          }
        }, 750);
      }, 620);
    };
    
    const envelopeClass = `envelope-body ${animState === 'flapOpening' || animState === 'extracting' || animState === 'settled' ? 'open-flap' : ''}`;
    
    let letterClass = 'letter-sheet';
    if (animState === 'extracting') letterClass = 'letter-sheet extracting';
    if (animState === 'settled') letterClass = 'letter-sheet settled';
    
    const showHint = animState === 'closed';
    
    if (!item) return null;
    
    return (
      <div className="envelope-container">
        <div className={envelopeClass} onClick={handleEnvelopeClick}>
          <div className="envelope-flap"></div>
          <div style={{ height: '280px', background: 'rgba(80,48,20,0.18)', borderRadius: '0 0 12px 12px' }}></div>
          {showHint && (
            <div className="envelope-click-hint">
              ✉ 轻启信封 · 见字如面
            </div>
          )}
        </div>
        
        {/* 信纸内容 */}
        <div ref={letterRef} className={letterClass}>
          <div className="letter-content">
            <div className="letter-title">{item.title || "无名信札"}</div>
            {item.desc && <div className="letter-desc">{item.desc}</div>}
            {item.type === 'image' ? (
              <div className="letter-image">
                <img 
                  src={item.content} 
                  alt={item.title} 
                  loading="lazy" 
                  onError={(e) => { e.target.src = "https://picsum.photos/id/13/500/350"; }} 
                />
              </div>
            ) : (
              <div className="letter-text">{item.content}</div>
            )}
            {/* 落款人与日期区域（取代关键字） */}
            <div className="letter-signature">
              <span className="author">✍️ {item.author || "佚名"}</span>
              <span className="date">📅 {item.date || "无日期"}</span>
            </div>
          </div>
        </div>
      </div>
    );
  }

  function App() {
    const [query, setQuery] = useState("");
    const [searchResults, setSearchResults] = useState([]);
    const [currentIndex, setCurrentIndex] = useState(0);
    const [hasSearched, setHasSearched] = useState(false);
    const [resetCounter, setResetCounter] = useState(0);
    const inputRef = useRef(null);
    
    const performSearch = useCallback((searchTerm) => {
      const trimmed = searchTerm.trim();
      if (!trimmed) {
        setSearchResults([]);
        setHasSearched(true);
        setCurrentIndex(0);
        setResetCounter(prev => prev + 1);
        return;
      }
      const results = searchByKeywords(EMBEDDED_DB, trimmed);
      setSearchResults(results);
      setCurrentIndex(results.length > 0 ? 0 : -1);
      setHasSearched(true);
      setResetCounter(prev => prev + 1);
    }, []);
    
    const handleSearch = () => performSearch(query);
    const onKeyDown = (e) => { if (e.key === 'Enter') handleSearch(); };
    
    const goPrev = () => {
      if (searchResults.length === 0) return;
      const newIndex = (currentIndex - 1 + searchResults.length) % searchResults.length;
      setCurrentIndex(newIndex);
      setResetCounter(prev => prev + 1);
    };
    
    const goNext = () => {
      if (searchResults.length === 0) return;
      const newIndex = (currentIndex + 1) % searchResults.length;
      setCurrentIndex(newIndex);
      setResetCounter(prev => prev + 1);
    };
    
    const currentItem = searchResults.length > 0 && currentIndex >= 0 ? searchResults[currentIndex] : null;
    const showEmpty = hasSearched && searchResults.length === 0;
    
    return (
      <div className="app">
        <div className="header">
          <div className="title">📜 秋笺寄忆</div>
          <div className="sub">一纸尺素 · 慢展流年</div>
        </div>
        <div className="search-section">
          <div className="search-bar">
            <input
              ref={inputRef}
              className="search-input"
              value={query}
              onChange={(e) => setQuery(e.target.value)}
              onKeyDown={onKeyDown}
              placeholder="输入关键字…"
            />
            <button className="search-btn" onClick={handleSearch}>寻信</button>
          </div>
        </div>
        <div className="stage">
          {showEmpty && (
            <div className="empty-state">
              <div className="empty-icon">🍂</div>
              <p>没有找到「{query}」相关的信札</p>
              <p style={{ fontSize: '0.7rem', marginTop: 10 }}>试试其他字句</p>
            </div>
          )}
          {!hasSearched && query === "" && !showEmpty && (
            <div className="empty-state">
              <div className="empty-icon">✉️</div>
              <p>输入关键字，点击「寻信」出现信封</p>
              <p style={{ fontSize: '0.7rem' }}>然后轻点信封，信纸将以3D效果抽出</p>
            </div>
          )}
          {!showEmpty && currentItem && (
            <>
              <LetterDisplay key={`${currentItem.id}-${resetCounter}`} item={currentItem} />
              {searchResults.length > 1 && (
                <div className="result-nav">
                  <button className="nav-btn" onClick={goPrev} disabled={searchResults.length <= 1}>◀ 上一封</button>
                  <span className="result-counter">{currentIndex + 1} / {searchResults.length}</span>
                  <button className="nav-btn" onClick={goNext} disabled={searchResults.length <= 1}>下一封 ▶</button>
                </div>
              )}
              {searchResults.length === 1 && (
                <div className="result-nav" style={{ opacity: 0.6 }}>
                  <span className="result-counter">✨ 孤本信札 ✨</span>
                </div>
              )}
            </>
          )}
        </div>
        <footer>✦ 一纸书笺藏岁月，拆开便是旧时温。 ✦</footer>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
